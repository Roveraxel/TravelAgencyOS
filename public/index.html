<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GarlicOS — TravelAgencyOS</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar no-print">
    <div class="topbar-left">
      <div class="brand">
        <img src="/favicon.svg" width="22" height="22" alt="" aria-hidden="true" style="border-radius:5px">
        <span>GarlicOS</span>
      </div>
      <nav class="top-nav" role="tablist" aria-label="Navigație principală">
        <button type="button" class="top-nav-btn is-active" data-view="trips" role="tab" aria-selected="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ui-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          Sejururi
        </button>
        <button type="button" class="top-nav-btn" data-view="analytics" role="tab" aria-selected="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ui-icon" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Analytics
        </button>
        <button type="button" class="top-nav-btn" data-view="tasks" role="tab" aria-selected="false">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="ui-icon" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Sarcini
        </button>
      </nav>
    </div>
    <div class="topbar-right">
      <a href="/?board=1" class="btn btn-secondary btn-sm">Board Public</a>
      <span class="local-pill" title="Date salvate exclusiv în localStorage; nu introduceți CNP sau date reale">
        Demo local
      </span>
      <button type="button" id="reset-demo-btn" class="btn btn-secondary btn-sm">Reset</button>
      <button type="button" id="new-trip-btn" class="btn btn-accent btn-sm">+ Sejur</button>
    </div>
  </header>

  <!-- VIEW 1: SEJURURI (Selector -> 3-Pane Workspace OR Edit Trip View) -->
  <section id="view-trips" class="view-section">
    <div id="trips-home-page" class="page-container"></div>
    <div id="trip-workspace-page" hidden></div>
    <div id="trip-edit-page" class="page-container" style="max-width:760px" hidden></div>
  </section>

  <!-- VIEW 2: ANALYTICS -->
  <section id="view-analytics" class="view-section page-container" hidden></section>

  <!-- VIEW 3: SARCINI & SCADENȚE -->
  <section id="view-tasks" class="view-section page-container" hidden>
    <div class="page-header">
      <div>
        <h1>Scadențe &amp; Sarcini</h1>
        <p class="muted small">Follow-up-uri și termene de plată legate de sejururi.</p>
      </div>
      <div class="header-actions">
        <button type="button" id="parse-email-btn" class="btn btn-secondary btn-sm">+ Din Email</button>
        <button type="button" id="new-task-btn" class="btn btn-primary btn-sm">+ Sarcină nouă</button>
      </div>
    </div>
    <div id="tasks-list" class="stack"></div>
  </section>

  <!-- MODAL REUTILIZABIL -->
  <div id="app-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="modal-title">Formular</h2>
        <button type="button" id="modal-close-btn" class="btn btn-ghost btn-sm" aria-label="Închide">✕</button>
      </div>
      <form id="modal-form" class="form-stack" novalidate>
        <div id="modal-fields" class="form-stack"></div>
        <div id="modal-error" class="feedback-msg is-error" role="alert" hidden></div>
        <div class="form-actions">
          <button type="button" id="modal-cancel-btn" class="btn btn-ghost">Anulează</button>
          <button type="submit" class="btn btn-primary">Salvează</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-region" class="toast-region no-print" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
